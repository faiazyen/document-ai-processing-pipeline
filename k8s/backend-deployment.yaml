apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-ai-backend
  labels:
    app: document-ai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-ai-backend
  template:
    metadata:
      labels:
        app: document-ai-backend
    spec:
      containers:
        - name: backend
          image: document-ai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: document-ai-secrets
                  key: openai-api-key
            - name: OPENAI_MODEL
              value: "gpt-4.1-mini"
            - name: DATABASE_URL
              value: "sqlite:///./invoices.db"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
