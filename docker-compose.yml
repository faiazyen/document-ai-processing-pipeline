services:
  backend:
    build:
      context: services/ai-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_INPUT_USD_PER_1M_TOKENS=${OPENAI_INPUT_USD_PER_1M_TOKENS:-0}
      - OPENAI_OUTPUT_USD_PER_1M_TOKENS=${OPENAI_OUTPUT_USD_PER_1M_TOKENS:-0}
      - DATABASE_URL=sqlite:////app/data/invoices.db
      - PLATFORM_DEV_API_KEY=${PLATFORM_DEV_API_KEY:-}
      - API_KEY_HASH_SECRET=${API_KEY_HASH_SECRET:-local-development-secret}
      - DEFAULT_TENANT_ID=${DEFAULT_TENANT_ID:-personal-lab}
      - DEFAULT_TENANT_NAME=${DEFAULT_TENANT_NAME:-Personal Lab}
      - DEFAULT_REGION=${DEFAULT_REGION:-local}
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - PYTHON_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
